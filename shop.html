const H = () => ({apikey:SUPABASE_KEY, Authorization:"Bearer "+(token||SUPABASE_KEY), "Content-Type":"application/json"});

async function login(){
  const r = await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value,password:$("pw").value})});

}
async function poll(){
  try{
    const since = new Date(Date.now()-18*3600*1000).toISOString();
    const r = await fetch(SUPABASE_URL+"/rest/v1/orders?created_at=gte."+since+"&order=id.desc&limit=100",{headers:H()});
    if(!r.ok) throw new Error(r.status);
    orders = await r.json();
    let fresh = false;
    for(const o of orders){ if(!seen.has(o.id)){ seen.add(o.id); if(!first && o.status==="new") fresh = true; } }
    first = false;
    if(fresh) beep();
    draw(); $("st").textContent = "อัปเดตล่าสุด " + new Date().toLocaleTimeString("th-TH");
  }catch(e){ $("st").textContent = "เชื่อมต่อไม่ได้ กำลังลองใหม่... ("+e.message+")"; }
}
function beep(){
  if(!sound) return;
  try{ const c = new (window.AudioContext||window.webkitAudioContext)(); [0,0.25,0.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=0.3;o.start(c.currentTime+t);o.stop(c.currentTime+t+0.15);}); }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
function toggleSound(){ sound=!sound; $("sbtn").textContent="เสียง: "+(sound?"เปิด":"ปิด"); if(sound) beep(); }

function draw(){
  $("list").innerHTML = orders.map(o=>`<div class="card ${o.status==='done'?'done':''} ${o.paid?'paid':''}">

let shopOpen = true, shopS = {accepting:true, open_time:null, close_time:null};
function bkkHM(){ return new Date(Date.now()+7*3600000).toISOString().slice(11,16); }
function openNowS(s){
  if(!s.accepting) return false;
  if(!s.open_time || !s.close_time) return true;
  const o=s.open_time.slice(0,5), c=s.close_time.slice(0,5), t=bkkHM();
  return c>o ? (t>=o && t<c) : (t>=o || t<c);
}
async function loadShop(){
  try{
    const r = await fetch(SUPABASE_URL+"/rest/v1/shop_settings?id=eq.1&select=accepting,open_time,close_time",{headers:H()});
    const j = await r.json();
    if(j[0]){
      shopS = j[0]; shopOpen = openNowS(j[0]);
      const b = $("shopbtn");
      if(!j[0].accepting){ b.textContent="รับออเดอร์: ปิด"; b.style.background="#ffcdd2"; }
      else if(!shopOpen){ b.textContent="ปิดตามเวลา ("+j[0].open_time.slice(0,5)+"-"+j[0].close_time.slice(0,5)+")"; b.style.background="#ffe0b2"; }
      else { b.textContent="รับออเดอร์: เปิด"; b.style.background="#fff"; }
    }
  }catch(e){}
}
async function patchShop(body){
  await fetch(SUPABASE_URL+"/rest/v1/shop_settings?id=eq.1",{method:"PATCH",headers:H(),body:JSON.stringify(body)});

async function toggleShop(){
  if(!shopS.accepting){ if(confirm("เปิดรับออเดอร์?")) patchShop({accepting:true}); return; }

  if(confirm("ตอนนี้อยู่นอกเวลาเปิด-ปิด จะเปิดรับออเดอร์เลยและเลิกตั้งเวลา?")) patchShop({accepting:true, open_time:null, close_time:null});
}
async function setHours(){
  const v = prompt("เวลาเปิด-ปิด เช่น 10:00-20:00 (เว้นว่างเพื่อเลิกตั้งเวลา)", "");

  if(v.trim()===""){ patchShop({open_time:null, close_time:null}); return; }

}

let MENU_ALL = [];
// ===== รูปเมนู =====
function shrink(file,maxW){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,maxW/img.width); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); c.toBlob(b=>b?res(b):rej(new Error("แปลงรูปไม่ได้")),"image/jpeg",0.8); URL.revokeObjectURL(img.src); }; img.onerror=()=>rej(new Error("เปิดรูปไม่ได้")); img.src=URL.createObjectURL(file); }); }
function openPhoto(){
  $("sPhoto").innerHTML = `<h3>รูปเมนู</h3>
    <select id="pSel">${MENU_ALL.map(m=>`<option value="${m.idx}">${esc(m.n)}</option>`).join("")}</select>
    <div id="pNow" class="small" style="margin:6px 0"></div>
    <input type="file" id="pFile" accept="image/*">
    <button class="mbtn" onclick="uploadPhoto()">อัปโหลดรูป</button>
    <button class="mbtn gray" onclick="closeM('mPhoto')">ปิด</button>`;
  $("pSel").onchange = showNow; showNow();
  $("mPhoto").classList.add("show");
}
function closeM(id){ $(id).classList.remove("show"); }
async function showNow(){
  const i=+$("pSel").value;
  const r=await fetch(SUPABASE_URL+"/rest/v1/menu_photos?idx=eq."+i+"&select=file,updated_at",{headers:H()});
  const j=await r.json();
  $("pNow").innerHTML = j[0] ? `ตอนนี้มีรูปแล้ว <img src="${SUPABASE_URL}/storage/v1/object/public/menu-images/${j[0].file}?v=${encodeURIComponent(j[0].updated_at)}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;vertical-align:middle">` : "ยังไม่มีรูป";
}
async function uploadPhoto(){
  const i=+$("pSel").value, f=$("pFile").files[0];
  if(!f){ alert("เลือกไฟล์รูปก่อนครับ"); return; }
  try{
    const blob = await shrink(f, 800);
    const file = "item-"+i+".jpg";
    let r = await fetch(SUPABASE_URL+"/storage/v1/object/menu-images/"+file,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+token,"x-upsert":"true","Content-Type":"image/jpeg"},body:blob});
    if(!r.ok) throw new Error("อัปโหลดรูปไม่สำเร็จ "+(await r.text()));
    r = await fetch(SUPABASE_URL+"/rest/v1/menu_photos",{method:"POST",headers:{...H(),Prefer:"resolution=merge-duplicates"},body:JSON.stringify({idx:i,name:(MENU_ALL.find(m=>m.idx===i)||{}).n||"",file,updated_at:new Date().toISOString()})});
    if(!r.ok) throw new Error("บันทึกข้อมูลรูปไม่สำเร็จ "+(await r.text()));
    alert("อัปโหลดแล้ว ลูกค้าจะเห็นรูปภายในไม่กี่นาที");
    showNow();
  }catch(e){ alert(e.message); }
}

// ===== ยอดขาย =====
let salesRows = [];
function bkkDate(off){ return new Date(Date.now()+7*3600000+off*86400000).toISOString().slice(0,10); }
function openSales(){
  $("sSales").innerHTML = `<h3>ยอดขาย</h3>
    <input type="date" id="sDate" value="${bkkDate(0)}" onchange="loadSales()">
    <div id="sSum"></div>
    <div class="wrap" id="sTbl"></div>
    <button class="mbtn" onclick="exportCsv()">ส่งออก CSV</button>
    <button class="mbtn gray" onclick="closeM('mSales')">ปิด</button>`;
  $("mSales").classList.add("show"); loadSales();
}
async function loadSales(){
  const d=$("sDate").value;
  const from=encodeURIComponent(d+"T00:00:00+07:00"), to=encodeURIComponent(d+"T23:59:59.999+07:00");
  const r=await fetch(SUPABASE_URL+"/rest/v1/sales_log?paid_at=gte."+from+"&paid_at=lte."+to+"&order=paid_at.asc&limit=5000",{headers:H()});
  salesRows = await r.json();
  if(!Array.isArray(salesRows)){ $("sSum").textContent="โหลดไม่สำเร็จ"; return; }
  const orders=new Set(salesRows.map(x=>x.order_id));
  const sum=k=>salesRows.filter(k).reduce((a,x)=>a+Number(x.line_total),0);
  const total=salesRows.reduce((a,x)=>a+Number(x.line_total),0);
  const cashN=new Set(salesRows.filter(x=>x.pay_method==="cash").map(x=>x.order_id)).size;
  const ppN=new Set(salesRows.filter(x=>x.pay_method!=="cash").map(x=>x.order_id)).size;
  $("sSum").innerHTML = `<div class="sum"><div>บิล<b>${orders.size}</b></div><div>ยอดรวม<b>${total} ฿</b></div><div>เงินสด (${cashN} บิล)<b>${sum(x=>x.pay_method==="cash")} ฿</b></div><div>พร้อมเพย์ (${ppN} บิล)<b>${sum(x=>x.pay_method!=="cash")} ฿</b></div></div>`;
  const agg={}; for(const x of salesRows){ agg[x.item_name]=agg[x.item_name]||{q:0,v:0}; agg[x.item_name].q+=Number(x.qty); agg[x.item_name].v+=Number(x.line_total); }
  const top=Object.entries(agg).sort((a,b)=>b[1].v-a[1].v).slice(0,10);
  $("sTbl").innerHTML = `<p><b>ขายดี 10 อันดับ</b></p><table class="tbl"><tr><th>เมนู</th><th>จำนวน</th><th>ยอด</th></tr>${top.map(([n,v])=>`<tr><td>${n}</td><td>${v.q}</td><td>${v.v}</td></tr>`).join("")}</table>
    <p><b>รายการทั้งหมด</b></p><table class="tbl"><tr><th>เวลาจ่าย</th><th>บิล</th><th>ชื่อ</th><th>เมนู</th><th>ตัวเลือก</th><th>ราคา</th><th>จ่าย</th></tr>${salesRows.map(x=>`<tr><td>${new Date(x.paid_at).toLocaleTimeString("th-TH",{timeZone:"Asia/Bangkok"})}</td><td>${x.order_id}</td><td>${x.nickname||""}</td><td>${x.item_name} x${x.qty}</td><td>${x.options||""}</td><td>${x.line_total}</td><td>${x.pay_method==="cash"?"เงินสด":"พร้อมเพย์"}</td></tr>`).join("")}</table>`;
}
function exportCsv(){
  if(!salesRows.length){ alert("ไม่มีข้อมูลในวันนี้"); return; }
  const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const head=["paid_at","order_id","nickname","item","qty","unit_price","line_total","options","pay_method"];
  const lines=[head.join(","), ...salesRows.map(x=>[x.paid_at,x.order_id,x.nickname,x.item_name,x.qty,x.unit_price,x.line_total,x.options,x.pay_method].map(esc).join(","))];
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="sales-"+$("sDate").value+".csv"; a.click();
}
// ===== จัดการเมนู =====
const OPT_KEYS = ["s","s3","t","b","k","x"];
function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function optsOf(m){ const o={}; for(const k of OPT_KEYS){ if(m[k]) o[k]=m[k]; } return o; }
function mergeMenu(rows){
  const by={}; rows.forEach(x=>by[x.idx]=x);
  const out=[];
  for(const b of BASE_ITEMS){
    const o=by[b.idx];
    if(!o){ out.push({...b, active:true, isNew:false}); continue; }
    out.push({idx:b.idx, n:o.name, c:o.cat, p:Number(o.price), ...(o.opts||{}), active:o.active, isNew:false});
  }
  for(const x of rows){ if(x.is_new) out.push({idx:x.idx, n:x.name, c:x.cat, p:Number(x.price), ...(x.opts||{}), active:x.active, isNew:true}); }
  return out;
}
async function loadMenuAll(){
  let rows=[];
  try{ const r=await fetch(SUPABASE_URL+"/rest/v1/menu_custom?select=*&order=idx.asc",{headers:H()}); const j=await r.json(); if(Array.isArray(j)) rows=j; }catch(e){}
  MENU_ALL = mergeMenu(rows);
}
function openMenu(){
  $("sMenu").innerHTML = `<h3>จัดการเมนู</h3>
    <button class="mbtn" onclick="editItem(null)">+ เพิ่มเมนูใหม่</button>
    <button class="mbtn" onclick="openCats()">หมวดหมู่</button>
    <button class="mbtn" onclick="openPromos()">โปรโมชั่น</button>
    ${MENU_ALL.map(m=>`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0;${m.active?'':'opacity:.5'}">
      <div><b>${esc(m.n)}</b><div class="small">${esc(m.c)} · ${m.p} ฿${m.isNew?' · เมนูใหม่':''}${m.active?'':' · ซ่อนอยู่'}</div></div>
      <div style="white-space:nowrap"><button class="small" onclick="editItem(${m.idx})">แก้ไข</button> <button class="small" onclick="toggleItem(${m.idx})">${m.active?'ซ่อน':'แสดง'}</button></div></div>`).join("")}
    <button class="mbtn gray" onclick="closeM('mMenu')">ปิด</button>`;
  $("mMenu").classList.add("show");
}
function editItem(idx){
  const m = idx===null ? {n:"",c:"",p:"",active:true,isNew:true} : MENU_ALL.find(x=>x.idx===idx);
  const cats=[...new Set(MENU_ALL.map(x=>x.c))];
  $("sMenu").innerHTML = `<h3>${idx===null?'เพิ่มเมนูใหม่':'แก้ไขเมนู'}</h3>
    <label class="small">ชื่อเมนู</label><input id="fN" value="${esc(m.n)}">
    <label class="small">หมวด</label><input id="fC" list="catList" value="${esc(m.c)}">
    <datalist id="catList">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <label class="small">ราคา (บาท)</label><input id="fP" type="number" min="0" value="${m.p}">
    <div class="small" style="margin-top:8px">ตัวเลือกที่ลูกค้าเลือกได้</div>
    <label style="display:block;margin:4px 0"><input type="checkbox" id="oS" ${m.s?'checked':''}> ความหวาน</label>
    <label style="display:block;margin:4px 0"><input type="checkbox" id="oS3" ${m.s3?'checked':''}> ความหวาน 3 ระดับ (0 / 50 / 100)</label>
    <label style="display:block;margin:4px 0"><input type="checkbox" id="oT" ${m.t?'checked':''}> ท็อปปิ้งและไข่มุก</label>
    <label style="display:block;margin:4px 0"><input type="checkbox" id="oB" ${m.b?'checked':''}> ปั่นเพิ่ม บวก <input id="oBv" type="number" min="0" value="${m.b||0}" style="width:80px;display:inline"> บาท</label>
    <label style="display:block;margin:4px 0"><input type="checkbox" id="oK" ${m.k?'checked':''}> เพิ่มช็อตกาแฟ</label>
    <label style="display:block;margin:4px 0"><input type="checkbox" id="oX" ${m.x?'checked':''}> ให้ลูกค้าพิมพ์ความต้องการ</label>
    <button class="mbtn" onclick="saveItem(${idx===null?'null':idx})">บันทึก</button>
    <button class="mbtn gray" onclick="openMenu()">ยกเลิก</button>`;
}
async function saveItem(idx){
  const name=$("fN").value.trim(), cat=$("fC").value.trim(), price=+$("fP").value;
  if(!name || !cat || !(price>=0)){ alert("กรอกชื่อ หมวด และราคาให้ครบ"); return; }
  const opts={};
  if($("oS").checked) opts.s=1;
  if($("oS3").checked) opts.s3=1;
  if($("oT").checked) opts.t=1;
  if($("oB").checked) opts.b=Math.max(0,+$("oBv").value||0);
  if($("oK").checked) opts.k=1;
  if($("oX").checked) opts.x=1;
  const cur = idx===null ? null : MENU_ALL.find(x=>x.idx===idx);
  let newIdx = idx;
  if(idx===null){ const used=MENU_ALL.map(x=>x.idx).filter(i=>i>=1000); newIdx = Math.max(999,...used)+1; }
  await saveRow({idx:newIdx, name, cat, price, opts, active: cur ? cur.active : true, is_new: cur ? cur.isNew : true, updated_at:new Date().toISOString()});
}
async function toggleItem(idx){
  const m=MENU_ALL.find(x=>x.idx===idx); if(!m) return;
  await saveRow({idx, name:m.n, cat:m.c, price:m.p, opts:optsOf(m), active:!m.active, is_new:m.isNew, updated_at:new Date().toISOString()});
}
async function saveRow(row){
  const r=await fetch(SUPABASE_URL+"/rest/v1/menu_custom",{method:"POST",headers:{...H(),Prefer:"resolution=merge-duplicates"},body:JSON.stringify(row)});
  if(!r.ok){ alert("บันทึกไม่สำเร็จ "+(await r.text())); return; }
  await loadMenuAll(); openMenu();
}
// ===== หมวดหมู่ =====
let CAT_ROWS = [], PROMO_ROWS = [], CAT_LIST = [];
async function loadCatsPromos(){
  try{ const r=await fetch(SUPABASE_URL+"/rest/v1/menu_categories?select=*&order=sort.asc",{headers:H()}); const j=await r.json(); CAT_ROWS = Array.isArray(j)?j:[]; }catch(e){}
  try{ const r=await fetch(SUPABASE_URL+"/rest/v1/promotions?select=*&order=id.asc",{headers:H()}); const j=await r.json(); PROMO_ROWS = Array.isArray(j)?j:[]; }catch(e){}
}
function catOrderList(){
  const set = new Set(MENU_ALL.map(m=>m.c)); CAT_ROWS.forEach(c=>set.add(c.name));
  const sortOf = n => { const r=CAT_ROWS.find(c=>c.name===n); return r ? r.sort : 1e6; };
  return [...set].sort((a,b)=> sortOf(a)-sortOf(b) || a.localeCompare(b,'th'));
}
function catActive(n){ const r=CAT_ROWS.find(c=>c.name===n); return r ? r.active!==false : true; }
async function saveCats(names){
  const rows = names.map((n,i)=>({name:n, sort:i*10, active:catActive(n)}));
  const r = await fetch(SUPABASE_URL+"/rest/v1/menu_categories",{method:"POST",headers:{...H(),Prefer:"resolution=merge-duplicates"},body:JSON.stringify(rows)});
  if(!r.ok){ alert("บันทึกหมวดไม่สำเร็จ "+(await r.text())); return false; }
  await loadCatsPromos(); return true;
}
function openCats(){
  CAT_LIST = catOrderList();
  $("sMenu").innerHTML = `<h3>หมวดหมู่</h3>
    <button class="mbtn" onclick="addCat()">+ เพิ่มหมวดใหม่</button>
    ${CAT_LIST.map((n,i)=>{ const hidden=!catActive(n); const cnt=MENU_ALL.filter(m=>m.c===n).length;
      return `<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0;${hidden?'opacity:.5':''}">
        <div><b>${esc(n)}</b><div class="small">${cnt} เมนู${hidden?' · ซ่อนอยู่':''}</div></div>
        <div style="white-space:nowrap"><button class="small" onclick="moveCat(${i},-1)">↑</button> <button class="small" onclick="moveCat(${i},1)">↓</button> <button class="small" onclick="renameCat(${i})">ชื่อ</button> <button class="small" onclick="toggleCat(${i})">${hidden?'แสดง':'ซ่อน'}</button></div></div>`; }).join("")}
    <button class="mbtn gray" onclick="openMenu()">กลับ</button>`;
  $("mMenu").classList.add("show");
}
async function moveCat(i,d){
  const names=[...CAT_LIST]; const j=i+d; if(j<0||j>=names.length) return;
  [names[i],names[j]]=[names[j],names[i]];
  if(await saveCats(names)) { CAT_LIST=catOrderList(); openCats(); }
}
async function toggleCat(i){
  const n=CAT_LIST[i];
  const rows=CAT_LIST.map((x,k)=>({name:x, sort:k*10, active: x===n ? !catActive(x) : catActive(x)}));
  const r=await fetch(SUPABASE_URL+"/rest/v1/menu_categories",{method:"POST",headers:{...H(),Prefer:"resolution=merge-duplicates"},body:JSON.stringify(rows)});
  if(!r.ok){ alert("ไม่สำเร็จ "+(await r.text())); return; }
  await loadCatsPromos(); openCats();
}
async function postRow(row){
  const r=await fetch(SUPABASE_URL+"/rest/v1/menu_custom",{method:"POST",headers:{...H(),Prefer:"resolution=merge-duplicates"},body:JSON.stringify(row)});
  if(!r.ok){ alert("บันทึกเมนูไม่สำเร็จ "+(await r.text())); return false; }
  return true;
}
async function renameCat(i){
  const old=CAT_LIST[i];
  const nn=(prompt("ชื่อหมวดใหม่", old)||"").trim();
  if(!nn || nn===old) return;
  if(CAT_LIST.includes(nn)){ alert("มีหมวดชื่อนี้อยู่แล้ว"); return; }
  for(const m of MENU_ALL.filter(x=>x.c===old)){
    const ok = await postRow({idx:m.idx, name:m.n, cat:nn, price:m.p, opts:optsOf(m), active:m.active, is_new:m.isNew, updated_at:new Date().toISOString()});
    if(!ok) return;
  }
  await fetch(SUPABASE_URL+"/rest/v1/menu_categories?name=eq."+encodeURIComponent(old),{method:"DELETE",headers:H()});
  const names=CAT_LIST.map(x=>x===old?nn:x);
  if(await saveCats(names)){ await loadMenuAll(); CAT_LIST=catOrderList(); openCats(); }
}
async function addCat(){
  const nn=(prompt("ชื่อหมวดใหม่")||"").trim();
  if(!nn) return;
  if(CAT_LIST.includes(nn)){ alert("มีหมวดชื่อนี้อยู่แล้ว"); return; }
  if(await saveCats([...CAT_LIST, nn])){ CAT_LIST=catOrderList(); openCats(); }
}

// ===== โปรโมชั่น =====
function toLocalInput(iso){ return iso ? new Date(Date.parse(iso)+7*3600000).toISOString().slice(0,16) : ""; }
function promoLabel(p){
  const tgt = p.scope==='all' ? 'ทั้งร้าน' : p.scope==='cat' ? 'หมวด '+p.target : 'เมนู '+((MENU_ALL.find(m=>String(m.idx)===String(p.target))||{}).n||p.target);
  return tgt+' · '+(p.kind==='percent' ? 'ลด '+p.value+'%' : 'ลด '+p.value+' บาท');
}
function promoRange(p){
  const f=s=>new Date(s).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',dateStyle:'short',timeStyle:'short'});
  return (p.starts_at?'เริ่ม '+f(p.starts_at):'เริ่มทันที')+' · '+(p.ends_at?'ถึง '+f(p.ends_at):'ไม่มีวันสิ้นสุด');
}
function openPromos(){
  $("sMenu").innerHTML = `<h3>โปรโมชั่น</h3>
    <button class="mbtn" onclick="editPromo(null)">+ เพิ่มโปรโมชั่น</button>
    ${PROMO_ROWS.length ? PROMO_ROWS.map(p=>`<div style="border-bottom:1px solid #eee;padding:8px 0;${p.active?'':'opacity:.5'}">
      <b>${esc(p.name)}</b><div class="small">${esc(promoLabel(p))}</div>
      <div class="small">${promoRange(p)}${p.active?'':' · ปิดอยู่'}</div>
      <div style="margin-top:4px"><button class="small" onclick="editPromo(${p.id})">แก้ไข</button> <button class="small" onclick="togglePromo(${p.id})">${p.active?'ปิด':'เปิด'}</button> <button class="small" onclick="deletePromo(${p.id})">ลบ</button></div></div>`).join("") : '<p class="small">ยังไม่มีโปรโมชั่น</p>'}
    <button class="mbtn gray" onclick="openMenu()">กลับ</button>`;
  $("mMenu").classList.add("show");
}
function editPromo(id){
  const p = id===null ? {name:"",scope:"all",target:"",kind:"percent",value:"",starts_at:null,ends_at:null} : PROMO_ROWS.find(x=>x.id===id);
  window._pTarget = p.target;
  $("sMenu").innerHTML = `<h3>${id===null?'เพิ่มโปรโมชั่น':'แก้ไขโปรโมชั่น'}</h3>
    <label class="small">ชื่อโปรโมชั่น (ลูกค้าจะเห็น)</label><input id="pN" value="${esc(p.name)}">
    <label class="small">ใช้กับ</label>
    <select id="pScope" onchange="fillTargets()">
      <option value="all" ${p.scope==='all'?'selected':''}>ทั้งร้าน</option>
      <option value="cat" ${p.scope==='cat'?'selected':''}>หมวดหมู่</option>
      <option value="item" ${p.scope==='item'?'selected':''}>เมนูเดียว</option></select>
    <div id="pTargetWrap"></div>
    <label class="small">รูปแบบส่วนลด</label>
    <select id="pKind"><option value="percent" ${p.kind==='percent'?'selected':''}>ลดเป็นเปอร์เซ็นต์</option><option value="amount" ${p.kind==='amount'?'selected':''}>ลดเป็นบาท</option></select>
    <label class="small">ค่าส่วนลด</label><input id="pV" type="number" min="0" value="${p.value}">
    <label class="small">เริ่ม (เว้นว่างได้)</label><input id="pS" type="datetime-local" value="${toLocalInput(p.starts_at)}">
    <label class="small">สิ้นสุด (เว้นว่างได้)</label><input id="pE" type="datetime-local" value="${toLocalInput(p.ends_at)}">
    <button class="mbtn" onclick="savePromo(${id===null?'null':id})">บันทึก</button>
    <button class="mbtn gray" onclick="openPromos()">ยกเลิก</button>`;
  fillTargets();
}
function fillTargets(){
  const sc=$("pScope").value, w=$("pTargetWrap"), cur=window._pTarget;
  if(sc==='all'){ w.innerHTML=""; return; }
  if(sc==='cat'){ w.innerHTML=`<label class="small">หมวด</label><select id="pT">${catOrderList().map(c=>`<option value="${esc(c)}" ${c===cur?'selected':''}>${esc(c)}</option>`).join("")}</select>`; return; }
  w.innerHTML=`<label class="small">เมนู</label><select id="pT">${MENU_ALL.map(m=>`<option value="${m.idx}" ${String(m.idx)===String(cur)?'selected':''}>${esc(m.n)}</option>`).join("")}</select>`;
}
async function savePromo(id){
  const name=$("pN").value.trim(), scope=$("pScope").value, kind=$("pKind").value, value=+$("pV").value;
  if(!name){ alert("ใส่ชื่อโปรโมชั่น"); return; }
  if(!(value>0)){ alert("ใส่ค่าส่วนลดให้มากกว่า 0"); return; }
  if(kind==='percent' && value>100){ alert("เปอร์เซ็นต์ต้องไม่เกิน 100"); return; }
  const toIso=v=>v ? new Date(v+":00+07:00").toISOString() : null;
  const row={name, scope, target: scope==='all' ? null : $("pT").value, kind, value, starts_at:toIso($("pS").value), ends_at:toIso($("pE").value)};
  let r;
  if(id===null) r=await fetch(SUPABASE_URL+"/rest/v1/promotions",{method:"POST",headers:H(),body:JSON.stringify({...row,active:true})});
  else r=await fetch(SUPABASE_URL+"/rest/v1/promotions?id=eq."+id,{method:"PATCH",headers:H(),body:JSON.stringify(row)});
  if(!r.ok){ alert("บันทึกไม่สำเร็จ "+(await r.text())); return; }
  await loadCatsPromos(); openPromos();
}
async function togglePromo(id){
  const p=PROMO_ROWS.find(x=>x.id===id); if(!p) return;
  await fetch(SUPABASE_URL+"/rest/v1/promotions?id=eq."+id,{method:"PATCH",headers:H(),body:JSON.stringify({active:!p.active})});
  await loadCatsPromos(); openPromos();
}
async function deletePromo(id){
  if(!confirm("ลบโปรโมชั่นนี้?")) return;
  await fetch(SUPABASE_URL+"/rest/v1/promotions?id=eq."+id,{method:"DELETE",headers:H()});
  await loadCatsPromos(); openPromos();
}
async function setO(id, patch){
  await fetch(SUPABASE_URL+"/rest/v1/orders?id=eq."+id,{method:"PATCH",headers:H(),body:JSON.stringify(patch)});

// ===== พิมพ์ผ่านบลูทูธ (Web Bluetooth, ใช้ได้เฉพาะเครื่องพิมพ์แบบ BLE) =====
let chr = null;
async function connectBT(){
  try{
    const dev = await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices:["000018f0-0000-1000-8000-00805f9b34fb","0000ff00-0000-1000-8000-00805f9b34fb","e7810a71-73ae-499d-8c15-faa9aef0c3f2","49535343-fe7d-4ae5-8fa9-9fafd205e455","0000ffe0-0000-1000-8000-00805f9b34fb"]});
    const srv = await dev.gatt.connect();
    const svcs = await srv.getPrimaryServices();
    const PRI=["000018f0-0000-1000-8000-00805f9b34fb","0000ff00-0000-1000-8000-00805f9b34fb","49535343-fe7d-4ae5-8fa9-9fafd205e455","e7810a71-73ae-499d-8c15-faa9aef0c3f2","0000ffe0-0000-1000-8000-00805f9b34fb"];
    let best=null;
    for(const s of svcs){ const cs = await s.getCharacteristics(); for(const c of cs){ if(c.properties.write||c.properties.writeWithoutResponse){ const rk=PRI.indexOf(s.uuid); const sc=rk<0?99:rk; if(!best||sc<best.sc) best={c,sc,svc:s.uuid}; } } }
    if(!best) throw new Error("ไม่พบช่องส่งข้อมูลของเครื่องพิมพ์");
    chr = best.c;
    $("st").textContent = "ต่อแล้ว บริการ "+best.svc.slice(0,8)+" (ถ้าพิมพ์ไม่ออก แจ้งรหัสนี้ให้ผม)";
    $("btbtn").textContent = "ต่อแล้ว: "+(dev.name||"เครื่องพิมพ์");
  }catch(e){ alert("ต่อบลูทูธตรงไม่ได้: "+e.message+"\nเครื่องนี้อาจไม่ใช่แบบ BLE ให้ใช้ปุ่มปริ้นผ่านหน้าต่างพิมพ์แทน"); }
}
function enc(s){ return new TextEncoder().encode(s); }
function tis620(str){ // แปลงอักษรไทยเป็น TIS-620 (ถ้าเครื่องพิมพ์ไม่รองรับไทย จะได้ตัวอักษรเพี้ยน)
  const out=[]; for(const ch of str){ const c=ch.codePointAt(0); if(c>=0x0E01&&c<=0x0E5B) out.push(c-0x0E00+0xA0); else if(c<128) out.push(c); else out.push(63); } return new Uint8Array(out);
}
function ticketText(o){
  const L=[];
  L.push(SHOP_NAME); L.push("คิว "+o.id+"  "+o.nickname); L.push(new Date(o.created_at).toLocaleString("th-TH")); L.push("--------------------------------");
  for(const c of (o.items||[])){ L.push(c.name+" x"+c.qty); const d=line(c); if(d) L.push("  "+d); }
  L.push("--------------------------------"); L.push("รวม "+o.total+" บาท  "+(o.pay_method==="cash"?"เงินสด ":"")+(o.paid?"(จ่ายแล้ว)":"(ยังไม่จ่าย)")); L.push(""); L.push(""); L.push("");
  return L.join("\n");
}
async function sendBT(bytes){
  for(let i=0;i<bytes.length;i+=20){ const part=bytes.slice(i,i+20); if(chr.properties.writeWithoutResponse && chr.writeValueWithoutResponse) await chr.writeValueWithoutResponse(part); else if(chr.writeValueWithResponse) await chr.writeValueWithResponse(part); else await chr.writeValue(part); await new Promise(r=>setTimeout(r,25)); }
}
async function printOrder(id){
  const o = orders.find(x=>x.id===id); if(!o) return;
  if(chr){
    try{
      const init = new Uint8Array([0x1B,0x40, 0x1B,0x74,0x16]); // reset + หน้ารหัสไทย (ค่าอาจต่างกันตามเครื่อง)
      const body = tis620(ticketText(o));
      const all = new Uint8Array(init.length+body.length); all.set(init,0); all.set(body,init.length);
      await sendBT(all); return;
    }catch(e){ alert("พิมพ์ผ่านบลูทูธไม่สำเร็จ ใช้หน้าต่างพิมพ์แทน\n"+e.message); }
  }
  printDialog(o);
}
function printDialog(o){
  const w = window.open("","_blank","width=320,height=600");
  w.document.write("<html><head><meta charset='utf-8'><style>@page{size:58mm auto;margin:2mm}body{font-family:sans-serif;font-size:12px;width:54mm}pre{white-space:pre-wrap;margin:0}</style></head><body><pre>"+ticketText(o).replace(/</g,"&lt;")+"</pre></body></html>");
  w.document.close(); w.focus(); setTimeout(()=>w.print(),300);
}
async function testPrint(){
  if(!chr){ printDialog({id:0,nickname:"ทดสอบ",created_at:new Date().toISOString(),total:65,paid:false,items:[{name:"ชาไทยเย็น",qty:1,sweet:"50 (หวานน้อย)",tops:["ไข่มุก"],blend:false,shot:false,note:""}]}); return; }
  try{
    const init=new Uint8Array([0x1B,0x40]);
    const a=enc("TEST PRINT 123 OK\n--------------------------------\n");
    const th=new Uint8Array([0x1B,0x74,0x16]);
    const b=tis620("ทดสอบภาษาไทย ชาไทยเย็น 65 บาท\n\n\n\n");
    const all=new Uint8Array(init.length+a.length+th.length+b.length);
    let o=0; for(const p of [init,a,th,b]){ all.set(p,o); o+=p.length; }
    await sendBT(all);
    $("st").textContent="ส่งข้อมูลไปเครื่องพิมพ์แล้ว ดูว่ามีตัวอักษรอังกฤษออกไหม และภาษาไทยออกไหม";
  }catch(e){ alert("ส่งไปเครื่องพิมพ์ไม่ได้: "+e.message); }
}
