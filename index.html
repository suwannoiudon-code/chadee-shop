.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;position:sticky;top:48px;z-index:4}

.sheet h3{margin:0 0 8px}.grp{margin:12px 0}.grp p{margin:0 0 6px;font-weight:600}
.opt{display:inline-block;margin:0 6px 6px 0}
.opt input{display:none}
.opt label{display:inline-block;padding:7px 12px;border:1px solid #bbb;border-radius:16px;font-size:14px}
.opt input:checked+label{background:#2e7d32;color:#fff;border-color:#2e7d32}
.btn{width:100%;border:0;background:#2e7d32;color:#fff;padding:13px;border-radius:10px;font-size:16px;margin-top:8px}
.btn.gray{background:#999}
input[type=text],textarea{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px;font-size:16px}
.line{display:flex;justify-content:space-between;margin:6px 0;font-size:14px}
.small{color:#666;font-size:12px}

// สร้างข้อความ PromptPay QR (EMVCo) ใส่ยอดเงิน
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}return c.toString(16).toUpperCase().padStart(4,"0");}
function ppPayload(id, amount){
  const t=(k,v)=>k+String(v.length).padStart(2,"0")+v;
  let acc = id.replace(/\D/g,"");
  let type, val;
  if(acc.length>=13){type="02";val=acc;} else {type="01";val="0066"+acc.replace(/^0/,"");}
  const merchant = t("00","A000000677010111")+t(type,val);
  let p = t("00","01")+t("01","12")+t("29",merchant)+t("53","764")+t("54",amount.toFixed(2))+t("58","TH")+"6304";
  return p+crc16(p);
}

async function submitOrder(){
  const nick = $("nick").value.trim();
  if(!nick){alert("กรุณาใส่ชื่อเล่นก่อนครับ");return;}
  const pm = (document.querySelector("input[name=pm]:checked")||{}).value || "cash";
  const body = {p_nickname:nick, p_items:cart, p_total:total(), p_pay:pm};
  try{
    const r = await fetch(SUPABASE_URL+"/rest/v1/rpc/create_order",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok) throw new Error(await r.text());
    const saved = await r.json();
    showPay(saved, nick, pm);
  }catch(e){ if(String(e.message).includes("SHOP_CLOSED")){accepting=false;checkShop();alert("ร้านปิดรับออเดอร์แล้วครับ");return;} alert("ส่งออเดอร์ไม่สำเร็จ ลองใหม่อีกครั้ง หรือแจ้งพนักงานครับ\n"+e.message); }
}

  } else {
    const payload = ppPayload(PROMPTPAY_ID, o.total);
    const qr = "https://api.qrserver.com/v1/create-qr-code/?size=260x260&data="+encodeURIComponent(payload);
    $("s2").innerHTML = `<h3>สั่งแล้ว คิวที่ ${o.id}</h3><p>ชื่อ ${nick} ยอด <b>${o.total} บาท</b></p><p>สแกนจ่ายด้วยแอปธนาคาร แล้วแจ้งพนักงานที่เคาน์เตอร์</p><p style="text-align:center"><img src="${qr}" width="260" height="260" alt="PromptPay QR"></p><p class="small">จ่ายเงินให้เรียบร้อยก่อนกดสั่งเพิ่ม เพราะ QR จะหายไป</p><button class="btn gray" onclick="closeM('m2')">สั่งเพิ่ม (ออเดอร์ใหม่)</button>`;
  }
  $("m2").classList.add("show"); cart=[]; drawBar();

let CATS_CUST = {}, PROMOS = [];
function orderNames(list){ return list.sort((x,y)=>((CATS_CUST[x]||{}).sort ?? 1e6)-((CATS_CUST[y]||{}).sort ?? 1e6) || x.localeCompare(y,'th')); }
function promoOf(m){
  const now = Date.now(); let best = null;
  for(const p of PROMOS){
    if(p.starts_at && now < Date.parse(p.starts_at)) continue;
    if(p.ends_at && now > Date.parse(p.ends_at)) continue;
    const hit = p.scope==='all' || (p.scope==='cat' && p.target===m.c) || (p.scope==='item' && String(p.target)===String(m.idx));
    if(!hit) continue;
    const price = p.kind==='percent' ? Math.round(m.p*(1-Number(p.value)/100)) : Math.max(0, m.p-Number(p.value));
    if(!best || price < best.price) best = {price, name:p.name};
  }
  return best;
}
function priceHtml(m){
  const pr = promoOf(m);
  return pr ? `<span style="text-decoration:line-through;color:#999;font-size:12px">${m.p}</span> <span style="color:#c62828">${pr.price} ฿</span>` : `${m.p} ฿`;
}
async function loadMenu(){
  try{
    const H2 = {apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY};
    const [rows, catRows, promos] = await Promise.all([
      fetch(SUPABASE_URL+"/rest/v1/menu_custom?select=*&order=idx.asc",{headers:H2}).then(r=>r.json()),
      fetch(SUPABASE_URL+"/rest/v1/menu_categories?select=*&order=sort.asc",{headers:H2}).then(r=>r.json()).catch(()=>[]),
      fetch(SUPABASE_URL+"/rest/v1/promotions?select=*&active=eq.true",{headers:H2}).then(r=>r.json()).catch(()=>[])
    ]);
    if(!Array.isArray(rows)) return;
    CATS_CUST = {};
    (Array.isArray(catRows)?catRows:[]).forEach(c=>CATS_CUST[c.name]={sort:c.sort, active:c.active});
    PROMOS = Array.isArray(promos) ? promos : [];
    const by = {}; rows.forEach(x=>by[x.idx]=x);
    const out = [];
    for(const b of BASE){
      const o = by[b.idx];
      if(!o){ out.push(b); continue; }
      if(o.active) out.push({idx:b.idx, n:o.name, c:o.cat, p:Number(o.price), ...(o.opts||{})});
    }
    for(const x of rows){ if(x.is_new && x.active) out.push({idx:x.idx, n:x.name, c:x.cat, p:Number(x.price), ...(x.opts||{})}); }
    MENU = out.filter(m => !(CATS_CUST[m.c] && CATS_CUST[m.c].active===false));
    cats = orderNames([...new Set(MENU.map(m=>m.c))]);
    if(!cat || !cats.includes(cat)) cat = cats[0];
    drawCats(); drawList();
  }catch(e){}
}
async function loadPhotos(){
  try{
    const r = await fetch(SUPABASE_URL+"/rest/v1/menu_photos?select=idx,file,updated_at",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
    const j = await r.json();
    PHOTO = {};
    for(const p of j){ PHOTO[p.idx] = SUPABASE_URL+"/storage/v1/object/public/menu-images/"+p.file+"?v="+encodeURIComponent(p.updated_at); }
    drawList();
  }catch(e){}
}
function bkkHM(){ return new Date(Date.now()+7*3600000).toISOString().slice(11,16); }
function isOpenNow(s){
  if(!s.accepting) return false;
  if(!s.open_time || !s.close_time) return true;
  const o=s.open_time.slice(0,5), c=s.close_time.slice(0,5), t=bkkHM();
  return c>o ? (t>=o && t<c) : (t>=o || t<c);
}
async function checkShop(){
  try{
    const r = await fetch(SUPABASE_URL+"/rest/v1/shop_settings?id=eq.1&select=accepting,message,open_time,close_time",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
    const j = await r.json();
    if(j[0]){
      const s=j[0];
      accepting = isOpenNow(s);
      const box=$("closed");
      const hrs = (s.open_time && s.close_time) ? (s.open_time.slice(0,5)+" - "+s.close_time.slice(0,5)+" น.") : "";
      if(!accepting){
        box.style.background="#c62828";
        box.textContent = !s.accepting ? (s.message || "ร้านปิดรับออเดอร์ชั่วคราว") : "ร้านปิดแล้ว เปิดรับออเดอร์ "+hrs;
        box.style.display="block";
      } else if(hrs){
        box.style.background="#2e7d32";
        box.textContent = "เปิดรับออเดอร์วันนี้ "+hrs+" หลังเวลาปิดจะสั่งไม่ได้";
        box.style.display="block";
      } else {
        box.style.display="none";
      }
    }
  }catch(e){}
}
checkShop(); setInterval(checkShop, 30000);
loadMenu(); setInterval(loadMenu, 300000);
loadPhotos(); setInterval(loadPhotos, 300000);
setCat(cats[0]);
